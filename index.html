<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>একতা ক্লাব ডেকোরেশন হিসাব</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif; 
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a 45%, #030712 100%);
      background-attachment: fixed;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-input {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.25);
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
  </style>
</head>
<body class="text-slate-100 min-h-screen p-3 sm:p-5 flex flex-col items-center pb-24 selection:bg-sky-500 selection:text-white">
  <div class="w-full max-w-xl">
    <!-- Header -->
    <header class="flex justify-between items-center py-4 px-2 mb-2">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-xl shadow-lg shadow-sky-500/25">
          🎪
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
            একতা ক্লাব
            <span class="text-[10px] uppercase font-bold tracking-wider bg-sky-500/20 text-sky-300 px-2 py-0.5 rounded-full border border-sky-500/30">ডেকোরেশন</span>
          </h1>
          <p class="text-[11px] text-slate-400 font-medium">ভাড়া, বুকিং ও বকেয়া হিসাব খাতা</p>
        </div>
      </div>
      
      <button id="loginBtn" class="bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-lg shadow-sky-600/30 transition">লগইন</button>
      
      <div id="userSection" class="hidden flex items-center gap-2.5 bg-slate-800/60 border border-white/5 py-1 px-2.5 rounded-2xl backdrop-blur-md">
        <span id="userName" class="text-xs text-slate-300 font-medium max-w-[100px] truncate"></span>
        <button id="logoutBtn" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 p-1.5 rounded-xl transition" title="লগআউট">
          <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i>
        </button>
      </div>
    </header>

    <!-- App Content Area -->
    <main id="appContent" class="hidden space-y-4">
      <!-- Quick Summary Dashboard -->
      <div class="grid grid-cols-3 gap-2.5">
        <div class="glass-card p-3 rounded-2xl border border-white/5 text-center">
          <p class="text-[11px] text-slate-400 font-medium">মোট অর্ডার</p>
          <h3 id="statTotalOrders" class="text-lg font-bold text-sky-400 mt-0.5">০</h3>
        </div>
        <div class="glass-card p-3 rounded-2xl border border-white/5 text-center">
          <p class="text-[11px] text-emerald-400 font-medium">মোট জমা</p>
          <h3 id="statTotalPaid" class="text-lg font-bold text-emerald-300 mt-0.5">৳০</h3>
        </div>
        <div class="glass-card p-3 rounded-2xl border border-white/5 text-center">
          <p class="text-[11px] text-rose-400 font-medium">মোট বাকি</p>
          <h3 id="statTotalDue" class="text-lg font-bold text-rose-300 mt-0.5">৳০</h3>
        </div>
      </div>

      <!-- Add New Order Form -->
      <form id="orderForm" class="glass-card p-4 rounded-3xl shadow-xl space-y-3">
        <div class="flex justify-between items-center border-b border-white/5 pb-2">
          <h2 class="text-xs font-bold uppercase tracking-wider text-sky-300 flex items-center gap-1.5">
            <i class="fa-solid fa-calendar-plus"></i> <span id="formTitle">নতুন বুকিং এন্ট্রি</span>
          </h2>
          <button type="button" id="cancelEditBtn" class="hidden text-xs text-slate-400 hover:text-white">বাতিল</button>
        </div>

        <input type="hidden" id="editOrderId" value="">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <input type="text" id="custName" placeholder="কাস্টমারের নাম *" required class="w-full glass-input text-white px-3 py-2 rounded-xl text-xs outline-none">
          <input type="tel" id="custPhone" placeholder="মোবাইল নম্বর" class="w-full glass-input text-white px-3 py-2 rounded-xl text-xs outline-none">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <div>
            <label class="text-[10px] text-slate-400 ml-1">অনুষ্ঠানের তারিখ</label>
            <input type="date" id="eventDate" required class="w-full glass-input text-white px-3 py-2 rounded-xl text-xs outline-none cursor-pointer">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 ml-1">অনুষ্ঠানের ঠিকানা / স্থান</label>
            <input type="text" id="eventAddress" placeholder="স্থান বা ঠিকানা" class="w-full glass-input text-white px-3 py-2 rounded-xl text-xs outline-none">
          </div>
        </div>

        <!-- Dynamic Items Dropdown Section -->
        <div class="bg-slate-900/50 p-3 rounded-2xl border border-white/5 space-y-2.5">
          <div class="flex justify-between items-center">
            <label class="text-[11px] font-semibold text-sky-300 flex items-center gap-1">
              <i class="fa-solid fa-boxes-stacked"></i> মালামালের তালিকা, সংখ্যা ও দাম
            </label>
            <button type="button" id="addItemBtn" class="text-[11px] text-sky-400 hover:text-sky-300 bg-sky-500/10 px-2.5 py-1 rounded-lg border border-sky-500/20 font-medium transition flex items-center gap-1">
              <i class="fa-solid fa-plus text-[10px]"></i> আইটেম যোগ করুন
            </button>
          </div>

          <div id="itemsContainer" class="space-y-2">
            <!-- Dynamic rows will appear here -->
          </div>
        </div>

        <!-- Calculation Row -->
        <div class="grid grid-cols-3 gap-2 pt-1">
          <div>
            <label class="text-[10px] text-slate-400 ml-1">মোট বিল (৳)</label>
            <input type="number" id="totalAmount" placeholder="0" readonly class="w-full glass-input text-sky-300 bg-slate-900/80 px-3 py-2 rounded-xl text-xs outline-none font-bold">
          </div>
          <div>
            <label class="text-[10px] text-emerald-400 ml-1">জমা / অগ্রিম (৳)</label>
            <input type="number" id="paidAmount" placeholder="0" min="0" class="w-full glass-input text-white px-3 py-2 rounded-xl text-xs outline-none font-semibold">
          </div>
          <div>
            <label class="text-[10px] text-rose-400 ml-1">বাকি (৳)</label>
            <input type="number" id="dueAmount" placeholder="0" readonly class="w-full glass-input text-rose-300 bg-rose-500/10 px-3 py-2 rounded-xl text-xs outline-none font-bold">
          </div>
        </div>

        <div class="flex items-center justify-between pt-2">
          <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
            <input type="checkbox" id="returnStatus" class="rounded text-sky-500 focus:ring-0">
            <span>মালামাল ফেরত এসেছে</span>
          </label>
          <button type="submit" id="submitBtn" class="bg-gradient-to-r from-sky-500 to-indigo-600 hover:opacity-95 text-white px-5 py-2 rounded-xl text-xs font-semibold shadow-md shadow-sky-600/30 transition flex items-center gap-1.5 active:scale-95">
            <i class="fa-solid fa-floppy-disk"></i> <span id="submitBtnText">সংরক্ষণ করুন</span>
          </button>
        </div>
      </form>

      <!-- Search & Filter Row -->
      <div class="flex gap-2">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-xs"></i>
          <input type="text" id="searchInput" placeholder="নাম, ফোন বা স্থান দিয়ে খুঁজুন..." class="w-full glass-input text-white pl-9 pr-3 py-2 rounded-2xl text-xs outline-none">
        </div>
        
        <select id="filterStatus" class="glass-input rounded-2xl px-3 text-xs text-slate-300 outline-none cursor-pointer">
          <option value="all" class="bg-slate-900">সব রেকর্ড</option>
          <option value="due" class="bg-slate-900">বাকি আছে 🔴</option>
          <option value="paid" class="bg-slate-900">পরিশোধিত 🟢</option>
          <option value="not_returned" class="bg-slate-900">ফেরত বাকি 📦</option>
        </select>
      </div>

      <!-- Orders List -->
      <div id="ordersList" class="space-y-3 pt-1">
        <p class="text-slate-500 text-center text-sm py-8">লোড হচ্ছে...</p>
      </div>
    </main>

    <!-- Signed Out View -->
    <div id="loggedOutView" class="mt-20 text-center p-8 glass-card rounded-3xl shadow-2xl border border-white/10">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center mx-auto text-3xl shadow-xl shadow-sky-500/20 mb-4">
        🎪
      </div>
      <h2 class="text-lg font-bold text-white">একতা ক্লাব ডেকোরেশন হিসাব</h2>
      <p class="text-xs text-slate-400 mt-1 max-w-xs mx-auto">মালামাল ভাড়া ও লেনদেনের হিসাব ক্লাউডে রাখতে গুগল অ্যাকাউন্ট দিয়ে লগইন করুন।</p>
    </div>
  </div>

  <!-- Toast Message -->
  <div id="toast" class="fixed bottom-6 bg-slate-800/90 backdrop-blur-xl text-white border border-white/10 px-4 py-2 rounded-2xl text-xs shadow-2xl transition-all duration-300 transform translate-y-24 opacity-0 pointer-events-none flex items-center gap-2">
    <i class="fa-solid fa-circle-check text-sky-400"></i>
    <span id="toastMsg">সফল হয়েছে!</span>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, query, where, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCJXc8miGg_6bAZCb_SpYfGelwzxhA3bpw",
      authDomain: "apu-s-notes.firebaseapp.com",
      projectId: "apu-s-notes",
      storageBucket: "apu-s-notes.firebasestorage.app",
      messagingSenderId: "469045356302",
      appId: "1:469045356302:web:9db39c7df9564ca4c1995f",
      measurementId: "G-T6ELLRKVM4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let allOrders = [];

    const defaultItemsList = [
      "চেয়ার",
      "টেবিল",
      "বড় চামচ",
      "ছোট চামচ",
      "সামিয়ানা",
      "প্লেট",
      "বালতি",
      "বাতি",
      "কুন্তি",
      "ডেসকি",
      "গামলা",
      "জগ",
      "মগ",
      "অন্যান্য"
    ];

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const userSection = document.getElementById("userSection");
    const userName = document.getElementById("userName");
    const appContent = document.getElementById("appContent");
    const loggedOutView = document.getElementById("loggedOutView");

    const orderForm = document.getElementById("orderForm");
    const editOrderId = document.getElementById("editOrderId");
    const custName = document.getElementById("custName");
    const custPhone = document.getElementById("custPhone");
    const eventDate = document.getElementById("eventDate");
    const eventAddress = document.getElementById("eventAddress");
    const itemsContainer = document.getElementById("itemsContainer");
    const addItemBtn = document.getElementById("addItemBtn");

    const totalAmount = document.getElementById("totalAmount");
    const paidAmount = document.getElementById("paidAmount");
    const dueAmount = document.getElementById("dueAmount");
    const returnStatus = document.getElementById("returnStatus");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const submitBtnText = document.getElementById("submitBtnText");
    const formTitle = document.getElementById("formTitle");

    const ordersList = document.getElementById("ordersList");
    const searchInput = document.getElementById("searchInput");
    const filterStatus = document.getElementById("filterStatus");

    const statTotalOrders = document.getElementById("statTotalOrders");
    const statTotalPaid = document.getElementById("statTotalPaid");
    const statTotalDue = document.getElementById("statTotalDue");
    const toast = document.getElementById("toast");
    const toastMsg = document.getElementById("toastMsg");

    loginBtn.onclick = () => signInWithPopup(auth, provider).catch(err => alert("Login Error: " + err.message));
    logoutBtn.onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        userSection.classList.remove("hidden");
        loginBtn.classList.add("hidden");
        appContent.classList.remove("hidden");
        loggedOutView.classList.add("hidden");
        userName.innerText = user.displayName || "User";
        loadOrders(user.uid);
        if (itemsContainer.children.length === 0) {
          addItemRow();
        }
      } else {
        userSection.classList.add("hidden");
        loginBtn.classList.remove("hidden");
        appContent.classList.add("hidden");
        loggedOutView.classList.remove("hidden");
        allOrders = [];
      }
    });

    function addItemRow(itemName = "", customName = "", qty = "", rate = "", lineTotal = 0) {
      const row = document.createElement("div");
      row.className = "item-row flex flex-col gap-1.5 bg-slate-800/60 p-2.5 rounded-xl border border-white/5";

      let isCustom = itemName === "অন্যান্য" || (itemName && !defaultItemsList.includes(itemName));
      let selectedOption = isCustom ? "অন্যান্য" : itemName;

      let optionsHtml = defaultItemsList.map(item => 
        `<option value="${item}" ${item === selectedOption ? 'selected' : ''}>${item}</option>`
      ).join("");

      row.innerHTML = `
        <div class="flex items-center gap-1.5">
          <select class="item-select bg-slate-900 text-white text-xs px-2 py-1.5 rounded-lg border border-white/10 flex-1 outline-none">
            <option value="">মালামাল নির্বাচন করুন</option>
            ${optionsHtml}
          </select>
          <input type="number" placeholder="সংখ্যা" value="${qty}" min="1" class="item-qty w-16 glass-input text-white text-center text-xs py-1.5 rounded-lg outline-none">
          <input type="number" placeholder="দাম (৳)" value="${rate}" min="0" class="item-rate w-20 glass-input text-white text-center text-xs py-1.5 rounded-lg outline-none">
          <span class="item-total text-xs text-sky-400 font-semibold w-16 text-right">৳${lineTotal || 0}</span>
          <button type="button" class="remove-item-btn text-rose-400 hover:text-rose-300 p-1 text-xs">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
        <div class="custom-name-container ${selectedOption === 'অন্যান্য' ? '' : 'hidden'}">
          <input type="text" placeholder="মালামালের নাম লিখুন..." value="${customName || (isCustom ? itemName : '')}" class="custom-item-name w-full glass-input text-white px-2.5 py-1 rounded-lg text-xs outline-none border border-sky-500/30">
        </div>
      `;

      const qtyInput = row.querySelector(".item-qty");
      const rateInput = row.querySelector(".item-rate");
      const selectElem = row.querySelector(".item-select");
      const totalSpan = row.querySelector(".item-total");
      const removeBtn = row.querySelector(".remove-item-btn");
      const customContainer = row.querySelector(".custom-name-container");
      const customInput = row.querySelector(".custom-item-name");

      selectElem.onchange = () => {
        if (selectElem.value === "অন্যান্য") {
          customContainer.classList.remove("hidden");
          customInput.focus();
        } else {
          customContainer.classList.add("hidden");
        }
        updateLineTotal();
      };

      function updateLineTotal() {
        const q = parseFloat(qtyInput.value) || 0;
        const r = parseFloat(rateInput.value) || 0;
        const t = q * r;
        totalSpan.innerText = "৳" + t;
        calculateGrandTotal();
      }

      qtyInput.oninput = updateLineTotal;
      rateInput.oninput = updateLineTotal;

      removeBtn.onclick = () => {
        if (itemsContainer.children.length > 1) {
          row.remove();
          calculateGrandTotal();
        } else {
          showToast("কমপক্ষে একটি আইটেম থাকতে হবে!");
        }
      };

      itemsContainer.appendChild(row);
      updateLineTotal();
    }

    addItemBtn.onclick = () => addItemRow();

    function calculateGrandTotal() {
      let grandTotal = 0;
      const rows = itemsContainer.querySelectorAll(".item-row");
      rows.forEach(row => {
        const q = parseFloat(row.querySelector(".item-qty").value) || 0;
        const r = parseFloat(row.querySelector(".item-rate").value) || 0;
        grandTotal += (q * r);
      });

      totalAmount.value = grandTotal;
      calculateDue();
    }

    function calculateDue() {
      const tot = parseFloat(totalAmount.value) || 0;
      const pd = parseFloat(paidAmount.value) || 0;
      dueAmount.value = Math.max(0, tot - pd);
    }
    paidAmount.oninput = calculateDue;

    function getItemsData() {
      const items = [];
      const rows = itemsContainer.querySelectorAll(".item-row");
      rows.forEach(row => {
        const selectVal = row.querySelector(".item-select").value;
        const customVal = row.querySelector(".custom-item-name").value.trim();
        const qty = parseFloat(row.querySelector(".item-qty").value) || 0;
        const rate = parseFloat(row.querySelector(".item-rate").value) || 0;

        let finalName = selectVal;
        if (selectVal === "অন্যান্য") {
          finalName = customVal || "অন্যান্য";
        }

        if (finalName && qty > 0) {
          items.push({ 
            name: finalName, 
            isOther: selectVal === "অন্যান্য", 
            qty, 
            rate, 
            total: qty * rate 
          });
        }
      });
      return items;
    }

    function showToast(msg) {
      toastMsg.innerText = msg;
      toast.classList.remove("translate-y-24", "opacity-0");
      setTimeout(() => toast.classList.add("translate-y-24", "opacity-0"), 2200);
    }

    orderForm.onsubmit = async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const items = getItemsData();
      if (items.length === 0) {
        alert("অনুগ্রহ করে কমপক্ষে একটি মালামাল নির্বাচন করুন এবং সংখ্যা দিন!");
        return;
      }

      const tot = parseFloat(totalAmount.value) || 0;
      const pd = parseFloat(paidAmount.value) || 0;
      const due = Math.max(0, tot - pd);
      const editingId = editOrderId.value;

      const orderData = {
        uid: currentUser.uid,
        custName: custName.value.trim(),
        custPhone: custPhone.value.trim(),
        eventDate: eventDate.value,
        eventAddress: eventAddress.value.trim(),
        items: items,
        totalAmount: tot,
        paidAmount: pd,
        dueAmount: due,
        isReturned: returnStatus.checked,
        updatedAt: Date.now()
      };

      try {
        if (editingId) {
          await updateDoc(doc(db, "ekota_decoration_orders", editingId), orderData);
          showToast("অর্ডার আপডেট করা হয়েছে!");
        } else {
          orderData.createdAt = Date.now();
          await addDoc(collection(db, "ekota_decoration_orders"), orderData);
          showToast("নতুন বুকিং যুক্ত হয়েছে!");
        }
        resetForm();
      } catch (err) {
        alert("ত্রুটি: " + err.message);
      }
    };

    cancelEditBtn.onclick = resetForm;

    function resetForm() {
      editOrderId.value = "";
      orderForm.reset();
      itemsContainer.innerHTML = "";
      addItemRow();
      totalAmount.value = "";
      dueAmount.value = "";
      formTitle.innerText = "নতুন বুকিং এন্ট্রি";
      submitBtnText.innerText = "সংরক্ষণ করুন";
      cancelEditBtn.classList.add("hidden");
    }

    function loadOrders(uid) {
      const q = query(collection(db, "ekota_decoration_orders"), where("uid", "==", uid));
      onSnapshot(q, (snapshot) => {
        allOrders = [];
        snapshot.forEach((docSnap) => {
          allOrders.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderOrders();
      }, (err) => {
        console.error(err);
        ordersList.innerHTML = "<p class='text-rose-400 text-center text-sm py-4'>ডাটাবেজ লোড হচ্ছে না</p>";
      });
    }

    searchInput.oninput = () => renderOrders();
    filterStatus.onchange = () => renderOrders();

    function renderOrders() {
      const qText = searchInput.value.toLowerCase();
      const filter = filterStatus.value;

      let totalPaidSum = 0;
      let totalDueSum = 0;

      allOrders.forEach(o => {
        totalPaidSum += (o.paidAmount || 0);
        totalDueSum += (o.dueAmount || 0);
      });

      statTotalOrders.innerText = allOrders.length;
      statTotalPaid.innerText = "৳" + totalPaidSum.toLocaleString('bn-BD');
      statTotalDue.innerText = "৳" + totalDueSum.toLocaleString('bn-BD');

      let filtered = allOrders.filter(o => {
        const matchesSearch = 
          (o.custName || "").toLowerCase().includes(qText) ||
          (o.custPhone || "").includes(qText) ||
          (o.eventAddress || "").toLowerCase().includes(qText);

        if (!matchesSearch) return false;

        if (filter === "due") return (o.dueAmount || 0) > 0;
        if (filter === "paid") return (o.dueAmount || 0) === 0;
        if (filter === "not_returned") return !o.isReturned;
        return true;
      });

      filtered.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      ordersList.innerHTML = "";

      if (filtered.length === 0) {
        ordersList.innerHTML = `
          <div class="text-center py-10 text-slate-500">
            <i class="fa-solid fa-box-open text-3xl mb-2 opacity-40"></i>
            <p class="text-xs">কোনো অর্ডার পাওয়া যায়নি</p>
          </div>
        `;
        return;
      }

      filtered.forEach((order) => {
        const isPaid = (order.dueAmount || 0) === 0;
        const card = document.createElement("div");
        card.className = "glass-card p-4 rounded-3xl shadow-xl flex flex-col gap-2.5 border border-white/5";

        let itemsRenderHtml = "";
        if (Array.isArray(order.items)) {
          itemsRenderHtml = order.items.map(it => 
            `<div class="flex justify-between items-center text-xs text-slate-300 py-0.5 border-b border-white/5 last:border-none">
              <span>• ${it.name} (${it.qty}টি × ৳${it.rate})</span>
              <span class="font-semibold text-sky-300">৳${it.total}</span>
            </div>`
          ).join("");
        } else if (order.itemsList) {
          itemsRenderHtml = `<p class="text-xs text-slate-300">${order.itemsList}</p>`;
        }

        card.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <div>
              <h3 class="text-sm font-bold text-white flex items-center gap-2">
                ${order.custName}
                ${order.custPhone ? `<a href="tel:${order.custPhone}" class="text-sky-400 hover:text-sky-300 text-xs"><i class="fa-solid fa-phone"></i></a>` : ''}
              </h3>
              <p class="text-[11px] text-slate-400 flex items-center gap-2 mt-0.5">
                <span><i class="fa-regular fa-calendar text-sky-400"></i> ${order.eventDate || 'তারিখ নেই'}</span>
                ${order.eventAddress ? `<span>• <i class="fa-solid fa-location-dot text-rose-400"></i> ${order.eventAddress}</span>` : ''}
              </p>
            </div>
            
            <div class="flex items-center gap-1.5">
              ${isPaid 
                ? '<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-semibold px-2 py-0.5 rounded-full">পরিশোধিত</span>'
                : `<span class="bg-rose-500/10 text-rose-400 border border-rose-500/20 text-[10px] font-semibold px-2 py-0.5 rounded-full">বাকি ৳${order.dueAmount}</span>`
              }
              <button onclick="window.toggleReturn('${order.id}', ${!order.isReturned})" class="text-[10px] font-semibold px-2 py-0.5 rounded-full border transition ${order.isReturned ? 'bg-sky-500/10 text-sky-300 border-sky-500/20' : 'bg-amber-500/10 text-amber-300 border-amber-500/20'}" title="ফেরত স্ট্যাটাস পরিবর্তন করুন">
                ${order.isReturned ? '✓ ফেরত এসেছে' : '📦 ফেরত বাকি'}
              </button>
            </div>
          </div>

          <div class="bg-slate-900/60 p-2.5 rounded-2xl border border-white/5 space-y-1">
            <span class="text-[10px] text-slate-500 block font-semibold mb-1">ভাড়া দেওয়া মালামাল:</span>
            ${itemsRenderHtml}
          </div>

          <div class="flex justify-between items-center text-[11px] text-slate-400 pt-2 border-t border-white/5">
            <div class="flex items-center gap-3">
              <span>মোট: <b class="text-white">৳${order.totalAmount}</b></span>
              <span>জমা: <b class="text-emerald-400">৳${order.paidAmount}</b></span>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="window.startEdit('${order.id}')" class="bg-slate-700/30 hover:bg-slate-700/60 text-slate-300 hover:text-sky-400 px-2.5 py-1 rounded-lg transition text-xs">
                <i class="fa-regular fa-pen-to-square"></i> এডিট
              </button>
              <button onclick="window.deleteOrder('${order.id}')" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 px-2.5 py-1 rounded-lg transition text-xs">
                <i class="fa-regular fa-trash-can"></i>
              </button>
            </div>
          </div>
        `;
        ordersList.appendChild(card);
      });
    }

    window.toggleReturn = async (id, status) => {
      await updateDoc(doc(db, "ekota_decoration_orders", id), { isReturned: status });
    };

    window.startEdit = (id) => {
      const order = allOrders.find(o => o.id === id);
      if (!order) return;
      editOrderId.value = order.id;
      custName.value = order.custName || "";
      custPhone.value = order.custPhone || "";
      eventDate.value = order.eventDate || "";
      eventAddress.value = order.eventAddress || "";
      
      itemsContainer.innerHTML = "";
      if (Array.isArray(order.items) && order.items.length > 0) {
        order.items.forEach(it => {
          let isDefault = defaultItemsList.includes(it.name);
          let sel = isDefault ? it.name : "অন্যান্য";
          let customName = isDefault ? "" : it.name;
          addItemRow(sel, customName, it.qty, it.rate, it.total);
        });
      } else {
        addItemRow();
      }

      totalAmount.value = order.totalAmount || 0;
      paidAmount.value = order.paidAmount || 0;
      dueAmount.value = order.dueAmount || 0;
      returnStatus.checked = !!order.isReturned;
      
      formTitle.innerText = "বুকিং তথ্য এডিট করুন";
      submitBtnText.innerText = "আপডেট করুন";
      cancelEditBtn.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteOrder = async (id) => {
      if (confirm("আপনি কি নিশ্চিত এই বুকিং রেকর্ডটি মুছে ফেলতে চান?")) {
        await deleteDoc(doc(db, "ekota_decoration_orders", id));
        showToast("রেকর্ড মুছে ফেলা হয়েছে!");
      }
    };
  </script>
</body>
</html>
